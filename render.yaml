services:
  - type: web
    name: ai-study-scheduler
    runtime: python
    region: oregon
    buildCommand: ""
    startCommand: gunicorn run:app --workers 2 --timeout 120
    preDeployCommand: flask --app run db upgrade
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: studyflow-db
          property: connectionString

databases:
  - name: studyflow-db
    databaseName: studyflow
    user: studyflow
    region: oregon
